name: object_talk
description: "Point your camera at an object; it comes alive in AR and talks about itself."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  ar_flutter_plugin_2:
    path: ../ar_flutter_plugin
  audio_session: ^0.2.4
  firebase_ai: ^4.0.0
  firebase_app_check: ^0.4.8
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  flutter_thinking_orbs: ^0.1.0
  google_sign_in: ^7.2.0
  just_audio: ^0.10.6
  sensors_plus: ^7.1.0
  speech_to_text: ^7.5.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  fonts:
    - family: Gambarino
      fonts:
        - asset: assets/fonts/Gambarino-Regular.ttf

# Icon and launch screen art are renders of the app's orb: see
# test/brand_art_test.dart. Regenerate with `dart run flutter_launcher_icons`
# and `dart run flutter_native_splash:create`.
flutter_launcher_icons:
  ios: true
  android: true
  image_path: assets/brand/icon.png
  remove_alpha_ios: true
  background_color_ios: "#14110F"
  adaptive_icon_background: "#14110F"
  adaptive_icon_foreground: assets/brand/icon_foreground.png
  adaptive_icon_foreground_inset: 0

flutter_native_splash:
  color: "#14110F"
  image: assets/brand/splash.png
  android_12:
    color: "#14110F"
    image: assets/brand/splash_android12.png
