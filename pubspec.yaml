name: object_talk
description: "Point your camera at an object; it comes alive in AR and talks about itself."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  ar_flutter_plugin_2:
    path: ../ar_flutter_plugin
  audio_session: ^0.2.4
  firebase_ai: ^4.0.0
  firebase_app_check: ^0.4.8
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  flutter_thinking_orbs: ^0.1.0
  google_sign_in: ^7.2.0
  just_audio: ^0.10.6
  sensors_plus: ^7.1.0
  speech_to_text: ^7.5.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: Gambarino
      fonts:
        - asset: assets/fonts/Gambarino-Regular.ttf
